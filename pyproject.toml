[project]
name = "hakapik"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=50.0.2",
    "dnspython>=2.9.0",
    "httpx>=0.28.1",
    "idna>=3.20",
    "maxminddb>=3.2.0",
    "playwright>=1.64.1",
    "psycopg[binary]>=3.3.6",
    "rocksdict>=0.3.29",
    "tldextract>=5.4,<6",
    "warcio>=1.8.1",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "mmdb-writer>=0.2.7",
    "netaddr>=1.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.scripts]
hakapik = "hakapik.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hakapik"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
